name: CI/CD Pipeline - Sistema de Saude (Java + React)

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  # ========================================
  # JOB 1: TESTES DO BACKEND
  # ========================================
  test-backend:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do codigo
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Testes Unitarios e de Integracao
        working-directory: ./backend
        run: mvn test -B

      - name: Cobertura de codigo (JaCoCo)
        working-directory: ./backend
        run: mvn verify -B

  # ========================================
  # JOB 2: TESTES DO FRONTEND
  # ========================================
  test-frontend:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do codigo
        uses: actions/checkout@v4

      - name: Configurar Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Instalar dependencias
        working-directory: ./frontend
        run: npm install

      - name: Build de producao
        working-directory: ./frontend
        run: npm run build

  # ========================================
  # JOB 3: DEPLOY RENDER (CD)
  # ========================================
  deploy:
    needs: [test-backend, test-frontend]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - name: Checkout do codigo
        uses: actions/checkout@v4

      - name: Deploy Backend no Render
        run: |
          curl -X POST "${{ secrets.RENDER_DEPLOY_HOOK_BACKEND }}"

      - name: Deploy Frontend no Render
        run: |
          curl -X POST "${{ secrets.RENDER_DEPLOY_HOOK_FRONTEND }}"
